name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff

      - name: Lint with ruff (syntax + undefined names only)
        run: ruff check .

      - name: Run tests
        env:
          FLASK_ENV: testing
        run: |
          if [ -d tests ]; then
            pip install pytest
            pytest tests/ -q --tb=short
          else
            echo "No tests directory found — skipping"
          fi
